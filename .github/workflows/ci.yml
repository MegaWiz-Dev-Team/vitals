name: ci

# The chain path is the point of this workflow. Five tests covering the relay, multi-device
# accounts, commit-reveal and the anchoring flow sat behind `#[ignore]` and had never run
# anywhere — a local validator hands out 500,000,000 SOL and needs no faucet, so the reason
# they were skipped never applied.
#
# Every action is pinned to a commit SHA. A tag is a pointer somebody can move; a workflow that
# verifies the supply chain while pulling its own tools by tag would be checking everyone's
# integrity but its own.
on:
  push:
    branches: [main, develop]
  pull_request:

# The token can read the checkout and nothing else. Jobs that need more say so themselves.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests
        run: cargo test --workspace

  chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: install solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: build the program
        run: cd crates/vitals-program && cargo build-sbf --arch v3

      - name: start a validator
        run: |
          solana-test-validator --reset --quiet &
          for _ in $(seq 1 60); do
            solana -u localhost cluster-version >/dev/null 2>&1 && break
            sleep 1
          done
          solana -u localhost cluster-version

      - name: deploy
        id: deploy
        run: |
          solana config set --url localhost
          solana-keygen new --no-bip39-passphrase -s --force -o ~/.config/solana/id.json
          solana airdrop 100
          # A throwaway program id: CI must never touch the real keypair, which *is* the program's
          # identity on every cluster and is deliberately not in this repository.
          solana-keygen new --no-bip39-passphrase -s --force -o /tmp/program.json
          solana program deploy target/deploy/vitals_program.so --program-id /tmp/program.json
          echo "id=$(solana address -k /tmp/program.json)" >> "$GITHUB_OUTPUT"

      - name: the deployed program is this build
        env:
          VITALS_PROGRAM_ID: ${{ steps.deploy.outputs.id }}
          VITALS_RPC: http://127.0.0.1:8899
        run: scripts/verify-deploy.sh

      - name: chain tests
        env:
          VITALS_PROGRAM_ID: ${{ steps.deploy.outputs.id }}
          VITALS_RPC: http://127.0.0.1:8899
        # Serially: each test spawns its own server, and four servers competing for one validator
        # under a CI runner's CPU budget is a slower, flakier way to learn nothing extra.
        run: |
          cargo test -p vitals-web --test chain_flow -- --ignored --test-threads=1
          cargo test -p vitals-cli --test driver -- --ignored

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: advisories, licences, sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses sources bans

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The whole history: a key committed five commits ago and deleted four ago is still
          # published the moment the repository opens.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all
      - name: keep it with the run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: "**/*.cdx.json"
          retention-days: 90
