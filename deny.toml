# cargo-deny — the supply-chain gate.
#
# Three questions, answered on every push: does any dependency carry a known vulnerability, is
# every licence compatible with shipping this workspace as AGPL-3.0-or-later, and does every
# crate come from crates.io rather than a git URL somebody could move.

[advisories]
version = 2
yanked = "deny"
# Every id below arrives through the Solana SDK at versions pinned upstream — the deployed
# program's own dependency tree is solana-program + borsh + this workspace, and the signing/TLS
# advisories sit in the client and test tooling. The alternative to ignoring them is vendoring
# the SDK. The list is exact ids on purpose: a NEW advisory still fails the build, and every
# entry is owed a re-check at each SDK bump.
ignore = [
    "RUSTSEC-2021-0145", # atty — via env_logger 0.9 ← solana-logger ← solana-sdk. Unmaintained,
                         # no fixed release exists; the unaligned read is cfg(windows) and the
                         # server runs Linux, so the vulnerable code is not even compiled.
    "RUSTSEC-2022-0093", # ed25519-dalek 1.x double-pubkey-sign — via solana-keypair ← solana-sdk.
                         # The fix is 2.0, which arrives with solana-keypair 3.x, i.e. an SDK
                         # major. The oracle needs a caller that signs under an attacker-chosen
                         # public key; the relay signs with its own mounted key and nothing else.
    "RUSTSEC-2023-0126", # rsa Marvin — via test/rpc tooling, no RSA in this product
    "RUSTSEC-2024-0344", # curve25519-dalek timing — the 3.2.0 copy, pulled only by ed25519-dalek 1.x
                         # above; 3.x has no fixed release and 4.1.3 (fixed) is already what the
                         # rest of the tree uses. Local timing side channel, not remote.
    "RUSTSEC-2024-0375", # atty successor advisory chain
    "RUSTSEC-2024-0388", # derivative unmaintained — proc-macro, build-time only
    "RUSTSEC-2024-0436", # paste unmaintained — proc-macro, build-time only
    "RUSTSEC-2025-0119", # tonic — rpc client path only
    "RUSTSEC-2025-0141", # solana client tree
    "RUSTSEC-2025-0161", # solana client tree
    "RUSTSEC-2026-0097", # solana client tree
    # The three rustls-webpki advisories are all against 0.101.7, and the server no longer
    # carries it: vitals-web depends on solana-rpc-client rather than the whole solana-client,
    # which took the pubsub/websocket TLS stack (rustls 0.21 → webpki 0.101) out of the binary.
    # What ships is 0.103.15, at or above the fix for all three. 0.101.7 survives only under
    # solana-program-test, a dev-dependency, so these stay listed and stay out of production.
    "RUSTSEC-2026-0098", # rustls-webpki name constraints — test tree only
    "RUSTSEC-2026-0099", # rustls-webpki wildcard — same
    "RUSTSEC-2026-0104", # rustls-webpki CRL panic — same, and it needs RevocationOptions,
                         # which is opt-in and nothing here opts in
    "RUSTSEC-2026-0173", # solana client tree
    "RUSTSEC-2026-0186", # solana client tree
    "RUSTSEC-2026-0247", # solana client tree
    "RUSTSEC-2026-0248", # solana client tree
    "RUSTSEC-2026-0251", # solana client tree
    "RUSTSEC-2026-0253", # solana client tree
    "RUSTSEC-2026-0255", # bincode — via solana zk sdk, not used by this workspace directly
]

[licenses]
version = 2
# What an AGPL-3.0-or-later work may incorporate. Everything here is GPL-compatible permissive
# or weak copyleft; anything not listed fails the build and gets a deliberate decision instead
# of a shrug.
allow = [
    "AGPL-3.0-or-later",   # this workspace's own licence — deny checks our crates too
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    "CDLA-Permissive-2.0",   # a data licence (root-cert bundle); permissive, no copyleft, AGPL-safe
    "OpenSSL",
]

[[licenses.clarify]]
# ring's licence file is famously a concatenation; this is the standard clarification.
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
multiple-versions = "allow"   # the Solana SDK guarantees duplicates; denying is noise
wildcards = "deny"            # an external "*" is a dependency nobody chose
# ...but the crates in this workspace depend on each other by path with no version, which reads
# as a wildcard and is not one — it is how a workspace refers to its own members. Allow only
# those, so a real external "*" still fails.
allow-wildcard-paths = true
