[package]
publish = false   # internal workspace crate, never to crates.io
name = "vitals-cli"
description = "Drives the Vitals demo against a local validator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
solana-rpc-client = "3"
solana-sdk = "3"
# solana-sdk 3 no longer re-exports these; they are the same crates sdk 2 re-exported.
solana-commitment-config = "3"
solana-sdk-ids = "3"
borsh = { version = "1", features = ["derive"] }
vitals-program = { path = "../vitals-program" }
vitals-progress = { path = "../vitals-progress" }
vitals-replay = { path = "../vitals-replay" }
vitals-osce = { path = "../vitals-osce" }
vitals-sce = { path = "../vitals-sce" }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[lints]
workspace = true
