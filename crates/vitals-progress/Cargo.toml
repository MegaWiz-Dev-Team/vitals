[package]
name = "vitals-progress"
description = "Integer twin of Embla's competency arithmetic — the copy that runs onchain"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["std"]
std = ["sha2/std"]
# On-chain builds: use the sha256 syscall instead of the pure-Rust crate.
solana = ["dep:solana-program"]

[dependencies]
sha2 = { version = "0.10", default-features = false }
solana-program = { version = "2", optional = true }
