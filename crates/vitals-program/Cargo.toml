[package]
name = "vitals-program"
description = "The Vitals Solana program — recomputes progression instead of trusting a claim"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2"
borsh = { version = "1", features = ["derive"] }
vitals-progress = { path = "../vitals-progress", default-features = false, features = ["solana"] }
