[package]
name = "vitals-replay"
description = "Replays an encounter tape against Embla's physiology automaton and reduces it to anchorable facts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
vitals-sce = { path = "../vitals-sce" }
vitals-progress = { path = "../vitals-progress" }
sha2 = "0.10"

[[bin]]
name = "vitals-replay"
path = "src/main.rs"
