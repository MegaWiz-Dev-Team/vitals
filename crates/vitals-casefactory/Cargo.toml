[package]
publish = false   # internal workspace crate, never to crates.io
name = "vitals-casefactory"
description = "Compiles cases from the embla-cases library into the ward's runnable scenario packs — deterministic, validated by replay, provisional until a clinician has read them"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
# The ward's own engine, replayer and marker. Depended on rather than imitated: a pack this crate
# calls valid has been parsed by the parser that will run it, replayed by the replayer that will
# verify it, and marked by the scorer that will grade it. Nothing here re-implements any of them.
vitals-sce = { path = "../vitals-sce" }
vitals-replay = { path = "../vitals-replay" }
vitals-osce = { path = "../vitals-osce" }
# The one pass bar for the whole system: a World pack's rubric carries the ward's 70 %, not the
# case's own OSCE pass mark (the clinical advisor's ruling 3.1, 20 Sep 2026).
vitals-progress = { path = "../vitals-progress" }

[lib]
name = "vitals_casefactory"
path = "src/lib.rs"

[[bin]]
name = "vitals-casefactory"
path = "src/main.rs"

[lints]
workspace = true
