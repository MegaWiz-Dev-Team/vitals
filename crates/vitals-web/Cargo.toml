[package]
publish = false   # internal workspace crate, never to crates.io
name = "vitals-web"
description = "Play EP1 in a browser — the automaton, the monitor, and the leaf at the end"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
vitals-sce = { path = "../vitals-sce" }
vitals-replay = { path = "../vitals-replay" }
vitals-progress = { path = "../vitals-progress" }
vitals-osce = { path = "../vitals-osce" }
vitals-program = { path = "../vitals-program" }
solana-rpc-client = "2"
solana-sdk = "4"
borsh = { version = "1", features = ["derive"] }

[lib]
name = "vitals_web"
path = "src/lib.rs"

[[bin]]
name = "vitals-web"
path = "src/main.rs"

[dev-dependencies]
ureq = { version = "2", features = ["json"] }
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true
