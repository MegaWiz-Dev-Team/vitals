<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A shift on the ward — Vitals World</title>
<link rel="icon" type="image/svg+xml" href="/world/favicon.svg">
<link rel="apple-touch-icon" href="/world/apple-touch-icon.png">
<!-- Who this page is about, for whoever pastes its link into a chat. Written by the server from
     the patient's own row on the board — a page composed for nobody in particular carries nothing
     here (`og_tags`, UX review G5). -->
<!--OG-->
<!-- The ward's own page. It shares the bay's stylesheet and the bay's script with the Eternal
     entry, because the patient, the monitor and the tape must be the same in both — and it shares
     none of the season: no hero, no shelf, no episode list, no stars, nothing a stranger who came
     to treat one patient can click that leads into a single-player story.

     The founder's word for this, 16 ก.ย.: "ทำให้แยกกันเลยสิ" — separate them. -->
<link rel="stylesheet" href="/bay.css?v=__VITALS_BUILD__">
<style>
  .wd-bar{display:flex;gap:.9rem;align-items:baseline;flex-wrap:wrap;
    padding:.7rem 1rem;border-bottom:1px solid var(--rule,#d8ded9)}
  .wd-bar b{letter-spacing:.14em;font-size:.82rem;text-transform:uppercase}
  .wd-bar .brand{font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:.95rem;
    letter-spacing:-.01em;text-transform:none;color:var(--ink,#16302b)}
  .wd-bar .sub{color:var(--ink-3,#7b8a86);font-size:.82rem;letter-spacing:.1em;text-transform:uppercase}
  .wd-bar .sp{flex:1}
</style>
</head>
<body>

<!-- The corner of the page (founder, 16 ก.ย.: "มุมบนซ้าย"). The mark itself is composed in by the
     server at the marker below, so there is one drawing and one link home rather than a copy of
     the SVG living here and drifting from the other two. The marker is deliberately not written
     out in this comment: the composer would replace it here too, and a comment that quietly
     becomes a second copy of the thing it describes is how this page briefly had three marks.

     No button on the right any more: it named this door one way while the strip below named it
     another, and one door with two names is two doors to somebody reading the page. The mark is
     the way out, and the strip says so in words. -->
<div class="wd-bar">
  <!--BRAND-->
  <span class="sub">a public ward</span>
  <span class="sp"></span>
</div>

<!-- The script hides and shows these two by name. On this page the lobby is an empty anchor: the
     season it holds on the Eternal entry is exactly what must not exist here. -->
<div id="lobby" class="hide"></div>

<!-- The case being played is added to the bay's own select when the ward says who she is. This
     page used to carry a second, empty one so the season's list could not be found here; the
     server composes the list away now, so a second element would only be a duplicate id and the
     first of them silently winning. -->

<!--BAY-->

<script src="/bay.js?v=__VITALS_BUILD__"></script>
</body>
</html>
