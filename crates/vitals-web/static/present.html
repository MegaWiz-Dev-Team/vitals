<style>
html{scroll-behavior:smooth}
body{scroll-snap-type:y mandatory}
section.slide{scroll-snap-align:start;scroll-snap-stop:always;min-height:100vh}
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} }

#deck-nav{position:fixed;right:1rem;bottom:1rem;z-index:99;display:flex;align-items:center;gap:.35rem;
  background:rgba(12,26,32,.86);backdrop-filter:blur(6px);border-radius:999px;padding:.3rem .4rem;
  font-family:"IBM Plex Mono",monospace;box-shadow:0 8px 28px -10px rgba(8,20,24,.6)}
#deck-nav button{border:0;background:none;color:#fff;cursor:pointer;font:inherit;font-size:.9rem;
  line-height:1;padding:.3rem .55rem;border-radius:999px;opacity:.85}
#deck-nav button:hover{background:rgba(255,255,255,.18);opacity:1}
#deck-nav button:disabled{opacity:.28;cursor:default;background:none}
#deck-nav button:focus-visible{outline:2px solid #26c0a5;outline-offset:1px}
#deck-n{color:#fff;font-size:.72rem;letter-spacing:.06em;font-variant-numeric:tabular-nums;
  padding:0 .2rem;min-width:3.2rem;text-align:center}
/* A progress rule along the top: how far through you are, without a number to read. */
#deck-bar{position:fixed;top:0;left:0;height:2px;background:#26c0a5;z-index:99;width:0;
  transition:width .2s ease-out}
@media print{ #deck-nav,#deck-bar{display:none} body{scroll-snap-type:none} }
</style>
<div id="deck-bar"></div>
<nav id="deck-nav" aria-label="slides">
  <button id="deck-prev" title="previous — ← or Page Up" aria-label="previous slide">←</button>
  <span id="deck-n">1 / 1</span>
  <button id="deck-next" title="next — → space or Page Down" aria-label="next slide">→</button>
  <button id="deck-full" title="fullscreen — f" aria-label="fullscreen">⛶</button>
</nav>
<script>
(()=>{
  const slides=[...document.querySelectorAll('section.slide')];
  if(!slides.length) return;
  const nav=document.getElementById('deck-nav');
  const bar=document.getElementById('deck-bar');
  const label=document.getElementById('deck-n');
  const prev=document.getElementById('deck-prev');
  const next=document.getElementById('deck-next');

  /* Which slide is on screen is a question about scroll position, not something to track in a
     variable — the wheel, the scrollbar and a trackpad swipe all move it too, and a variable
     would drift away from what the viewer is actually looking at. */
  const current=()=>{
    let best=0,near=Infinity;
    slides.forEach((s,i)=>{ const d=Math.abs(s.getBoundingClientRect().top);
      if(d<near){ near=d; best=i; } });
    return best;
  };
  const go=i=>{
    const n=Math.max(0,Math.min(slides.length-1,i));
    slides[n].scrollIntoView({block:'start'});
    if(location.hash!=='#'+(n+1)) history.replaceState(null,'','#'+(n+1));
    paint(n);
  };
  const paint=n=>{
    label.textContent=(n+1)+' / '+slides.length;
    bar.style.width=(slides.length<2?100:(n/(slides.length-1))*100)+'%';
    prev.disabled=n===0; next.disabled=n===slides.length-1;
  };

  prev.onclick=()=>go(current()-1);
  next.onclick=()=>go(current()+1);
  document.getElementById('deck-full').onclick=()=>
    document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();

  addEventListener('keydown',e=>{
    /* Never steal a key from something being typed into. */
    const t=e.target;
    if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    const k=e.key;
    if(k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'||k===' '||k==='Enter'){ e.preventDefault(); go(current()+1); }
    else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'||k==='Backspace'){ e.preventDefault(); go(current()-1); }
    else if(k==='Home'){ e.preventDefault(); go(0); }
    else if(k==='End'){ e.preventDefault(); go(slides.length-1); }
    else if(k==='f'||k==='F'){ e.preventDefault(); document.getElementById('deck-full').click(); }
  });

  addEventListener('scroll',()=>{
    clearTimeout(nav._t); nav._t=setTimeout(()=>paint(current()),90);
  },{passive:true});

  /* Deep link: /slides#4 opens on slide four, so a link can point at one slide. */
  const at=parseInt((location.hash||'').slice(1),10);
  if(at>=1&&at<=slides.length) requestAnimationFrame(()=>go(at-1)); else paint(0);
})();
</script>
