<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vitals — the resus bay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ─────────────────────────────────────────────────────────────
   The room is lit. The monitor is the one dark object in it.
   That contrast is how a resus bay actually looks, and it is why
   this reads as a bedside rather than a terminal.
   ───────────────────────────────────────────────────────────── */
:root{
  --room:#EFF3F2; --card:#FFFFFF; --card-2:#F6F9F8;
  --ink:#0E1719; --ink-2:#4A5B5E; --ink-3:#8496 98;
  --ink-3:#849698; --line:#DDE5E4;
  --act:#0B6E58; --act-soft:#E3F0EC;
  --warn:#B4590F; --warn-soft:#FBEDE1;
  --alarm:#C6362E; --alarm-soft:#FBE8E6;
  /* monitor — real patient-monitor channel colours */
  --mon-bg:#070F0E; --mon-line:#16241F;
  --hr:#4ADE80; --spo2:#38BDF8; --bp:#F87171; --rr:#FBBF24; --tmp:#E6EFEE;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--room);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}

.app{max-width:88rem;margin:0 auto;padding:1rem 1.1rem 3rem;
  display:grid;gap:1rem;grid-template-columns:1fr}
@media(min-width:64rem){.app{grid-template-columns:1.6fr .9fr;align-items:start}}

/* ── top bar ── */
.bar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.6rem .9rem;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.65rem .9rem}
.brand{font-family:Archivo,sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:-.02em}
.brand span{color:var(--act)}
.ep{font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3)}
select,.btn{font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.04em;
  background:var(--card-2);color:var(--ink);border:1px solid var(--line);border-radius:7px;
  padding:.45rem .7rem;cursor:pointer;transition:border-color .12s,background .12s,transform .06s}
.btn:hover:not(:disabled){border-color:var(--act);background:var(--act-soft)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.go{background:var(--act);color:#fff;border-color:var(--act);font-weight:600}
.btn.go:hover:not(:disabled){background:#0a5e4b}
.spacer{margin-left:auto}

/* ── the bed ── */
.bed{position:relative;border-radius:12px;overflow:hidden;background:#0b1312;
  border:1px solid var(--line);aspect-ratio:16/10}
.bed img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .55s ease}
.bed img.on{opacity:1}
.bed .veil{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(4,10,10,.42) 0%,rgba(4,10,10,0) 26%,rgba(4,10,10,.10) 55%,rgba(4,10,10,.80) 100%)}

.ribbon{position:absolute;top:.75rem;left:.75rem;display:flex;gap:.45rem;align-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:.67rem;letter-spacing:.16em;text-transform:uppercase;
  background:rgba(6,14,14,.62);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);
  color:#E7EFEE;padding:.35rem .6rem;border-radius:999px}
.ribbon .dot{width:.45rem;height:.45rem;border-radius:50%;background:#8CA0A2}
.ribbon.Deteriorating .dot,.ribbon.Critical .dot{background:#FBBF24}
.ribbon.Arrest .dot,.ribbon.Dead .dot{background:#F87171}
.ribbon.Improving .dot,.ribbon.Recovered .dot{background:#4ADE80}
.ribbon.Critical,.ribbon.Arrest{border-color:rgba(248,113,113,.5)}
@media(prefers-reduced-motion:no-preference){
  .ribbon.Critical .dot,.ribbon.Arrest .dot{animation:pulse 1s infinite}
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.clock{position:absolute;top:.75rem;right:.75rem;font-family:"IBM Plex Mono",monospace;
  font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums;color:#E7EFEE;
  background:rgba(6,14,14,.62);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);
  padding:.3rem .6rem;border-radius:7px}

/* ── the monitor, sitting on the bed rail ── */
.monitor{position:absolute;left:.75rem;right:.75rem;bottom:.75rem;
  background:var(--mon-bg);border:1px solid #1E2E2A;border-radius:9px;overflow:hidden;
  box-shadow:0 12px 30px -12px rgba(0,0,0,.75)}
.trace{display:block;width:100%;height:52px;background:var(--mon-bg)}
.chans{display:grid;grid-template-columns:repeat(auto-fit,minmax(4.6rem,1fr));
  border-top:1px solid var(--mon-line)}
.ch{padding:.4rem .55rem;border-right:1px solid var(--mon-line)}
.ch:last-child{border-right:0}
.ch .l{font-family:"IBM Plex Mono",monospace;font-size:.54rem;letter-spacing:.16em;
  text-transform:uppercase;color:#5C716C}
.ch .n{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:1.35rem;line-height:1.15;
  font-variant-numeric:tabular-nums}
.ch.hr .n{color:var(--hr)} .ch.spo2 .n{color:var(--spo2)} .ch.bp .n{color:var(--bp)}
.ch.rr .n{color:var(--rr)} .ch.tmp .n{color:var(--tmp)} .ch.gcs .n{color:var(--tmp)}
.ch.alarm{background:rgba(198,54,46,.16)}
.ch.alarm .n{color:#FCA5A5}
@media(prefers-reduced-motion:no-preference){ .ch.alarm .n{animation:pulse 1.1s infinite} }

/* ── orders ── */
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.9rem}
.k{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:.6rem}
.orders{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.7rem}
form{display:flex;gap:.45rem}
input{flex:1;min-width:0;font-family:"IBM Plex Mono",monospace;font-size:.78rem;
  background:var(--card-2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:.5rem .65rem}
input:focus{outline:2px solid var(--act);outline-offset:1px;background:#fff}

/* ── the feed ── */
.feed{display:flex;flex-direction:column;gap:.3rem;max-height:19rem;overflow:auto;
  font-size:.85rem}
.feed .row{display:flex;gap:.5rem;align-items:baseline;padding:.28rem .45rem;border-radius:5px}
.feed .row .t{font-family:"IBM Plex Mono",monospace;font-size:.62rem;color:var(--ink-3);
  font-variant-numeric:tabular-nums;flex:none;width:2.7rem}
.feed .you{background:var(--card-2)}
.feed .beat{color:var(--act)} .feed .beat.harm{color:var(--warn);background:var(--warn-soft)}
.feed .beat.end{color:var(--alarm);background:var(--alarm-soft);font-weight:600}
.feed .note{color:var(--ink-3);font-style:italic}

/* ── outcome + chain ── */
.result{grid-column:1/-1;display:none;background:var(--card);border:1px solid var(--line);
  border-left:4px solid var(--act);border-radius:10px;padding:1rem 1.1rem}
.result.lose{border-left-color:var(--alarm)}
.result h2{margin:0 0 .15rem;font-family:Archivo,sans-serif;font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
.result.win h2{color:var(--act)} .result.lose h2{color:var(--alarm)}
.result .sub{color:var(--ink-2);font-size:.9rem}
.leaf{font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--ink-2);word-break:break-all;
  background:var(--card-2);border:1px solid var(--line);padding:.5rem .6rem;border-radius:6px;margin:.6rem 0}
.chainrow{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.verdict{margin-top:.6rem;display:flex;flex-direction:column;gap:.28rem;
  font-family:"IBM Plex Mono",monospace;font-size:.72rem}
.verdict .g{color:var(--act)} .verdict .r{color:var(--warn)} .verdict .n{color:var(--ink-3)}
.hint{font-size:.78rem;color:var(--ink-3)}
</style>
</head>
<body>
<div class="app">

  <div class="bar">
    <span class="brand">Vital<span>s</span></span>
    <span class="ep" id="ep-name">the resus bay</span>
    <select id="ep">
      <option value="ep1">EP1 · The Last Bite</option>
      <option value="ep2">EP2 · Time Is Muscle</option>
      <option value="ep3">EP3 · Don't Make Him Cry</option>
      <option value="ep4">EP4 · The Masquerader</option>
      <option value="ep5">EP5 · The Night the Stars Fell</option>
    </select>
    <button class="btn go" id="start">start the shift</button>
    <button class="btn" id="pause" disabled>hold</button>
    <span class="spacer ep" id="chainstate">—</span>
  </div>

  <main>
    <div class="bed">
      <img id="ph-stable" src="/img/stable.jpg" alt="the patient">
      <img id="ph-deteriorating" src="/img/deteriorating.jpg" alt="">
      <img id="ph-critical" src="/img/critical.jpg" alt="">
      <img id="ph-arrest" src="/img/arrest.jpg" alt="">
      <img id="ph-improving" src="/img/improving.jpg" alt="">
      <img id="ph-recovered" src="/img/recovered.jpg" alt="">
      <img id="ph-dead" src="/img/dead.jpg" alt="">
      <div class="veil"></div>
      <div class="ribbon" id="ribbon"><span class="dot"></span><span id="status">waiting</span></div>
      <div class="clock" id="clock">0:00</div>

      <div class="monitor">
        <canvas class="trace" id="trace" width="900" height="52"></canvas>
        <div class="chans" id="chans"></div>
      </div>
    </div>
  </main>

  <aside style="display:flex;flex-direction:column;gap:1rem">
    <div class="panel">
      <div class="k">your orders</div>
      <div class="orders" id="orders"></div>
      <form id="f" autocomplete="off">
        <input id="cmd" placeholder="or type one — adrenaline im, oxygen, supine…" disabled>
        <button class="btn go" id="go" type="submit" disabled>do it</button>
      </form>
    </div>
    <div class="panel">
      <div class="k">what happened</div>
      <div class="feed" id="feed"><div class="row"><span class="t">—</span><span class="note">press start the shift</span></div></div>
    </div>
  </aside>

  <section class="result" id="result">
    <h2 id="outcome"></h2>
    <div class="sub" id="outnote"></div>
    <div class="leaf" id="leaf"></div>
    <div class="chainrow">
      <button class="btn go" id="anchor">anchor this run on chain</button>
      <button class="btn" id="c4" disabled>claim Expert</button>
      <button class="btn" id="c3" disabled>claim Proficient</button>
      <button class="btn" id="c2" disabled>claim Competent</button>
      <button class="btn" id="c1" disabled>claim Advanced beginner</button>
      <button class="btn" id="copy">copy the tape</button>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="hint" style="margin-top:.5rem">Hand the tape and the scenario to anyone — they recompute this leaf without asking us.</div>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
const ORDERS={
 ep1:["adrenaline im","oxygen","lay her flat","normal saline bolus","admit for observation","let her stand up","chlorpheniramine","discharge home"],
 ep2:["ecg","aspirin","activate the cath lab","heparin","nitrate","defibrillate","wait for the troponin"],
 ep3:["keep him calm","blow-by oxygen","call ent and anaesthesia","secure the airway","ceftriaxone","look in the throat","iv access"],
 ep4:["wells score","d-dimer","ctpa","heparin","thrombolysis","oxygen","reassure and discharge"],
 ep5:["triage","tourniquet","needle decompression","transfuse","damage control","two litres of saline"]
};
/* The engine speaks in beats; a person hears a story. The raw beat stays in the title
   attribute so nothing is hidden — this only makes it readable. */
const SAY={
 "status:Stable":"she is holding","status:Deteriorating":"she is getting worse",
 "status:Critical":"she is crashing","status:Improving":"she is turning around",
 "status:Recovered":"she settles","status:Arrest":"she arrests","status:Dead":"she is gone",
 "threshold:biphasic":"the reaction comes back","threshold:going_quiet":"he goes quiet — that is worse",
 "threshold:stemi_recognised":"the ECG tells the truth","threshold:collapse":"she collapses",
 "terminal:WinDischarge":"she goes home","terminal:WinIcu":"she lives — ICU",
 "terminal:DeathArrest":"she dies","terminal:DeathBiphasic":"she dies at home"
};
const say=b=>SAY[b] || (b.startsWith("harm:") ? "harm — "+b.slice(5) : b.replace(/^[a-z]+:/,""));

let id=null,timer=null,over=false,seen=0,hr=90,phase=0;

function fmt(s){const m=Math.floor(s/60);return `${m}:${String(Math.round(s%60)).padStart(2,'0')}`}
function feed(cls,txt,raw,at){
  const r=document.createElement('div'); r.className='row '+cls;
  r.innerHTML=`<span class="t">${at!==undefined?fmt(at):''}</span><span>${txt}</span>`;
  if(raw)r.title=raw;
  $('#feed').appendChild(r); $('#feed').scrollTop=1e6;
}
function alarm(k,v){
  return ({spo2:v<90,sbp:v<85,hr:v>150||v<45,rr:v>34,gcs:v<12})[k]||false;
}
function show(status){
  const key=(status||'Stable').toLowerCase();
  document.querySelectorAll('.bed img').forEach(i=>i.classList.remove('on'));
  ($('#ph-'+key)||$('#ph-stable')).classList.add('on');
}

/* A trace that speeds up with the heart. Cheap, and it is what makes the bay feel alive. */
const cv=$('#trace'), cx=cv.getContext('2d');
function beat(x,w){ // one PQRST-ish cycle across width w, returns y offset
  const p=(x%w)/w, m=cv.height/2;
  if(p<0.10) return m-Math.sin(p/0.10*Math.PI)*3;
  if(p<0.16) return m+4;
  if(p<0.20) return m-20;
  if(p<0.24) return m+9;
  if(p<0.42) return m-Math.sin((p-0.24)/0.18*Math.PI)*5;
  return m;
}
function draw(){
  cx.fillStyle=getComputedStyle(document.body).getPropertyValue('--mon-bg')||'#070F0E';
  cx.fillRect(0,0,cv.width,cv.height);
  const w=Math.max(60, 5400/Math.max(hr,30));
  cx.strokeStyle='#4ADE80'; cx.lineWidth=1.6; cx.beginPath();
  for(let x=0;x<cv.width;x++){ const y=beat(x+phase,w); x?cx.lineTo(x,y):cx.moveTo(x,y); }
  cx.stroke();
  cx.fillStyle='#070F0E'; cx.fillRect((phase*-1)%cv.width,0,0,0);
  phase+=hr/22;
  requestAnimationFrame(draw);
}
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches) draw();

function paint(v){
  hr=v.hr;
  $('#ep-name').textContent=v.scenario+' · '+v.sce_hash.slice(0,10);
  const ch=[['hr',v.hr,'bpm'],['spo2',v.spo2,'%'],['bp',`${v.sbp}/${v.dbp}`,'mmHg'],
            ['rr',v.rr,'/min'],['tmp',v.temp,'°c'],['gcs',v.gcs,'']];
  $('#chans').innerHTML=ch.map(([k,n,u])=>{
    const key=k==='bp'?'sbp':k==='tmp'?'temp':k;
    const a=alarm(key, k==='bp'?v.sbp:n)?' alarm':'';
    return `<div class="ch ${k}${a}"><div class="l">${k==='tmp'?'temp':k}${u?' '+u:''}</div><div class="n">${n}</div></div>`;
  }).join('');
  $('#status').textContent=v.status; $('#ribbon').className='ribbon '+v.status;
  $('#clock').textContent=fmt(v.elapsed);
  show(v.status);

  for(let i=seen;i<v.beats.length;i++){
    const b=v.beats[i];
    feed('beat'+(b.startsWith('harm')?' harm':b.startsWith('terminal')?' end':''), say(b), b, v.elapsed);
  }
  seen=v.beats.length;

  if(v.outcome && !over){
    over=true; stop();
    const win=v.outcome.startsWith('Win');
    $('#result').className='result '+(win?'win':'lose'); $('#result').style.display='block';
    $('#outcome').textContent=say('terminal:'+v.outcome);
    $('#outnote').textContent=(v.harm.length?'Harm on the record: '+v.harm.join(', '):'No harm recorded.')
      +'  ·  '+v.outcome;
    $('#leaf').textContent=v.leaf;
    $('#verdict').innerHTML=''; $('#anchor').textContent='anchor this run on chain'; $('#anchor').disabled=false;
    ['#c1','#c2','#c3','#c4'].forEach(s=>$(s).disabled=true);
    $('#cmd').disabled=true; $('#go').disabled=true; $('#pause').disabled=true;
    chainState();
    $('#result').scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}

async function step(q){
  if(!id)return;
  const v=await (await fetch('/api/step?id='+id+q)).json();
  if(v.error)return feed('note',v.error);
  paint(v);
}
const run =()=>timer=setInterval(()=>step('&tick=2'),700);
const stop=()=>{clearInterval(timer);timer=null};

async function chainState(){
  const c=await (await fetch('/api/chain')).json();
  $('#chainstate').textContent = c.connected
    ? `localnet · tree #${c.tree_id} · ${c.anchored} anchored`
    : 'no validator — play works, anchoring does not';
  $('#anchor').disabled = !c.connected || !over;
  return c;
}

$('#start').onclick=async()=>{
  stop(); over=false; seen=0; $('#feed').innerHTML=''; $('#result').style.display='none';
  const ep=$('#ep').value;
  const r=await (await fetch('/api/new?ep='+ep)).json();
  if(r.error)return feed('note',r.error);
  id=r.id; paint(r.view);
  $('#orders').innerHTML=ORDERS[ep].map(a=>`<button class="btn" data-a="${a}">${a}</button>`).join('');
  $('#orders').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    feed('you','▸ '+b.dataset.a); step('&do='+encodeURIComponent(b.dataset.a));});
  $('#cmd').disabled=false; $('#go').disabled=false; $('#pause').disabled=false;
  $('#pause').textContent='hold'; $('#cmd').focus();
  feed('note','the clock is the patient — she does not wait');
  run(); chainState();
};
$('#pause').onclick=()=>{ if(timer){stop();$('#pause').textContent='resume';}
  else{run();$('#pause').textContent='hold';} };
$('#f').onsubmit=e=>{e.preventDefault();const a=$('#cmd').value.trim();if(!a)return;
  feed('you','▸ '+a);$('#cmd').value='';step('&do='+encodeURIComponent(a));};

$('#anchor').onclick=async()=>{
  $('#anchor').disabled=true; $('#anchor').textContent='anchoring…';
  const r=await (await fetch('/api/anchor?id='+id)).json();
  const v=$('#verdict');
  if(r.error){v.innerHTML+=`<span class="r">${r.error}</span>`;$('#anchor').textContent='anchor this run on chain';$('#anchor').disabled=false;return;}
  v.innerHTML+=`<span class="g">anchored at index ${r.index} · score ${r.score} · ${r.proven?'proven':'PROOF FAILED'}</span>`;
  v.innerHTML+=`<span class="n">root ${r.root.slice(0,24)}… · ${r.leaves} leaves · ${r.counted} counted toward a claim</span>`;
  $('#anchor').textContent='anchored'; ['#c1','#c2','#c3','#c4'].forEach(s=>$(s).disabled=false);
  chainState();
};
[['#c4',4],['#c3',3],['#c2',2],['#c1',1]].forEach(([sel,lv])=>{
  $(sel).onclick=async()=>{
    const r=await (await fetch('/api/claim?level='+lv)).json();
    $('#verdict').innerHTML += r.granted
      ? `<span class="g">✓ ${r.message}</span>` : `<span class="r">✗ ${r.message}</span>`;
  };
});
$('#copy').onclick=async()=>{
  const t=await (await fetch('/api/tape?id='+id)).json();
  await navigator.clipboard.writeText(JSON.stringify(t,null,1));
  $('#copy').textContent='tape copied';
};
show('Stable'); chainState();
</script>
</body>
</html>
