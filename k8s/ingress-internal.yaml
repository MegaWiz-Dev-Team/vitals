# TLS on an internal name only.
#
# vitals.asgard.internal — the house convention every other service here follows, resolved by an
# /etc/hosts entry pointing at the ingress, and signed by the cluster's own CA. So this is HTTPS
# without being publication. The public Ingress is a separate decision that comes after the patent
# filing, not a flag flipped here.
#
# Applied separately from vitals.yaml so that deploying never quietly exposes anything:
#   kubectl apply -f k8s/ingress-internal.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vitals-internal
  namespace: vitals
  annotations:
    cert-manager.io/cluster-issuer: "asgard-ca-issuer"
    # The page is one document and the API is chatty; neither needs a large body.
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["vitals.asgard.internal"]
      secretName: vitals-tls
  rules:
    - host: vitals.asgard.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vitals-web
                port: {number: 8474}
